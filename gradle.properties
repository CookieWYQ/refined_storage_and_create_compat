# Jade（指向信息模组，可选依赖）：**不再是 Maven 坐标** —— 用户机器到 Modrinth CDN 的 TLS 证书链
# 校验失败（certificate_unknown / PKIX path building failed），远程解析不可用，故改为工程内本地制品：
#   libs/jade-15.10.5+neoforge.jar
#   （来源：Modrinth 项目 jade / id nvQzSEkH / 版本 15.10.5+neoforge，sha1 d5bf134b3dbde9f5258666823900e21341dc0a50）
# 因此这里**故意不再声明 jade_version 属性**：避免留下「声明了却没人用 / 又在解析」的死配置。
# 升级时：替换 libs/ 下的文件并同步更新 build.gradle 里 Jade 那一段的注释。

