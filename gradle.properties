# Gradle 守护进程的 JVM 参数（org.gradle.jvmargs）。
#   -Xmx2G：默认堆大小（原值，保留不动）。
#   -Djavax.net.ssl.trustStoreType=Windows-ROOT（为什么这么改）：
#     Gradle 解析依赖走 HTTPS，TLS 信任链默认来自 JDK 自带的 lib/security/cacerts。
#     本机若装了代理 / 安全软件，它们会给 HTTPS 注入自己的根证书 —— 那张 cacerts 里通常**没有**这个根，
#     于是报 `(certificate_unknown) PKIX path building failed: unable to find valid certification path
#     to requested target`（2026-09-30 在用户机器上解析 Modrinth / Jade 时就是这个错）。
#     改用 **Windows 自己的受信任根存储**（Windows-ROOT）后，凡是 Windows 信任的根，Gradle 也认，
#     从根上绕开「JDK 自带 cacerts 不含本机注入根」这个环境问题。
#   —— 这是 **Windows 专有**写法：`Windows-ROOT` 是 SunJSSE 在 Windows 上支持的 truststore 类型；
#   别的操作系统（或 JDK 不支持该类型时）会退回默认 cacerts（不会比原来更差）。
#   那种情况下的正解是「把缺失的根证书导入 JDK 自己的信任库」，例如：
#     keytool -importcert -noprompt -cacerts -storepass changeit -alias myproxy -file <根证书.cer>
#   （-cacerts 指向的就是 $JAVA_HOME/lib/security/cacerts；本工程的 Gradle JVM = D:/java21，见文件末尾）
#   注意：这里**故意不写** https.proxyHost / https.proxyPort —— 本机没有任何 *_PROXY 环境变量，
#   擅自设代理会把本来直连的场景改坏；确实需要走代理时再按真实地址补这两项。
org.gradle.jvmargs=-Xmx2G -Djavax.net.ssl.trustStoreType=Windows-ROOT
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
## Environment Properties
# You can find the latest versions here: https://projects.neoforged.net/neoforged/neoforge
# The Minecraft version must agree with the Neo version to get a valid artifact
minecraft_version=1.21.1
# The Minecraft version range can use any release version of Minecraft as bounds.
# Snapshots, pre-releases, and release candidates are not guaranteed to sort properly
# as they do not follow standard versioning conventions.
minecraft_version_range=[1.21.1,1.22)
# The Neo version must agree with the Minecraft version to get a valid artifact
neo_version=21.1.248
# The Neo version range can use any version of Neo as bounds
neo_version_range=[21,)
# The loader version range can only use the major version of FML as bounds
loader_version_range=[4,)
parchment_minecraft_version=1.21.1
parchment_mappings_version=2025.12.21-nightly-SNAPSHOT
## Mod Properties
# The unique mod identifier for the mod. Must be lowercase in English locale. Must fit the regex [a-z][a-z0-9_]{1.json,63}
# Must match the String constant located in the main mod class annotated with @Mod.
mod_id=rs_create_compat
# The human-readable display name for the mod.
# 显示名含中文，Java Properties 按 ISO-8859-1 读取，故此处用 \uXXXX 转义，避免读取乱码。
mod_name=\u673a\u68b0\u52a8\u529b\u0026\u7cbe\u81f4\u5b58\u50a8\uff1a\u517c\u5bb9\u4e0e\u6539\u5584
# The license of the mod. Review your options at https://choosealicense.com/. All Rights Reserved is the default.
mod_license=All Rights Reserved
# The mod version. See https://semver.org/
mod_version=1.0.0
# The group ID for the mod. It is only important when publishing as an artifact to a Maven repository.
# This should match the base package used for the mod sources.
# See https://maven.apache.org/guides/mini/guide-naming-conventions.html
mod_group_id=cretae.cookiewyq
# The authors of the mod. This is a simple text string that is used for display purposes in the mod list.
mod_authors=CallMeACookieWYQ
# The description of the mod. This is a simple multiline text string that is used for display purposes in the mod list.
# 注意：此文件由 Java Properties 以 ISO-8859-1.json 读取，中文需用 \uXXXX 转义，因此这里使用英文描述。
mod_description=Adds bridges between Refined Storage and Create: sequence assembly autocrafting, storage and logistics machines.

