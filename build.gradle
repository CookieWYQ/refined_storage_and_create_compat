plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.144'
}

version = mod_version
group = mod_group_id

repositories {
    mavenLocal()
    mavenCentral()
    maven { url = "https://maven.createmod.net" } // Create, Ponder, Flywheel
    maven { url = "https://maven.ithundxr.dev/snapshots" } // Registrate
    maven { // Refined Storage
        url = "https://maven.creeperhost.net"
        content { includeGroup("com.refinedmods.refinedstorage") }
    }
    maven { url = "https://maven.blamejared.com" } // JEI
    maven { url = "https://maven.theillusivec4.top/" } // Curios（饰品栏 API，必装前置）
    maven { url = "https://maven.ftb.dev/releases" } // FTB Ultimine（可选：连锁套壳）
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// 统一 UTF-8 编译与资源处理，避免 Windows 平台默认 GBK 导致中文源码报错
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    // 说明：parchment 为 SNAPSHOT 且每次构建需联网校验（本项目网络受限导致 :classes 失败）。
    // 编译与运行不依赖 parchment（仅 IDE 参数名提示），故移除；联网环境可自行恢复。
    // parchment {
    //     mappingsVersion = project.parchment_mappings_version
    //     minecraftVersion = project.parchment_minecraft_version
    // }

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers.add('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()

            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()

            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // mostly optional in a single mod project
        // but multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

// ===== 构建指纹（日志自证）=====
// 为什么需要：run/logs/latest.log 里原本没有 git hash / 编译时间，只有 0.0.1-SNAPSHOT，
// 于是「日志里的行为」与「磁盘上的源码」只能靠文件 mtime 猜 —— 上一轮取证就因此把一份
// 其实**晚于**修复代码的日志误当成验证证据（见 TECHNICAL_HANDOFF.md §7.3 结论 ⑥）。
// 这里在每次构建时把「这一刻的 git hash / 分支 / dirty / 编译时间 / 源码数」写进
// src/main/resources/build_info.properties，随包进 jar；游戏启动时由
// support/RsccBuildInfo.java 打出唯一一行 [rscc-build]，任何日志因此可以自证版本。
// 注意：源文件树里的 build_info.properties 是**生成物**，由下面的任务与
// tools/manual_compile.ps1 刷新；读取方 RsccBuildInfo 在资源缺失时降级为 "?"（绝不抛）。
tasks.register('generateBuildInfo', Exec) {
    group = 'build'
    description = '刷新 src/main/resources/build_info.properties（构建指纹，供日志自证版本）'
    workingDir = projectDir
    commandLine 'python', 'tools/gen_build_info.py'
    // 每次都重跑：指纹的全部价值就是「编译那一刻」的时间戳
    outputs.upToDateWhen { false }
}

tasks.named('processResources') {
    dependsOn 'generateBuildInfo'
}


dependencies {
    // 机械动力 Create（官方 wiki 推荐配置）
    implementation("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") { transitive = false }
    implementation("net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}")
    compileOnly("dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_version}")
    runtimeOnly("dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}")
    implementation("com.tterrag.registrate:Registrate:${registrate_version}")

    // 精致存储 Refined Storage 2（官方 wiki 推荐配置）
    api("com.refinedmods.refinedstorage:refinedstorage-neoforge:${refinedstorage_version}")

    // RS 官方配件 Quartz Arsenal：无线合成终端（合成终端模式走它原版物品的 use 路径）
    implementation("com.refinedmods.refinedstorage:refinedstorage-quartz-arsenal-neoforge:${refinedstorageQuartzArsenalVersion}")

    // JEI（开发环境与运行时，可选）
    compileOnly("mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}")
    runtimeOnly("mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}")

    // Curios（饰品栏 API，必装前置）：dev 环境（runClient / runServer）需要它在场，
    // 终端才能放进饰品槽；本模组代码只用反射调用 Curios（见 support/RsccCuriosTerminalSlot），
    // 因此这里即使解析失败也不影响 javac 编译（tools/manual_compile.ps1 只用本地缓存 jar）。
    compileOnly("top.theillusivec4.curios:curios-neoforge:${curios_version}")
    runtimeOnly("top.theillusivec4.curios:curios-neoforge:${curios_version}")

    // Refined Storage - Curios Integration（必装前置）：只发布在 CurseForge / Modrinth，
    // 不在上面任何一个 Maven 仓库里，因此**不能**写成 maven 依赖（写成会解析失败、连带
    // :classes 一起挂）。开发环境请先执行一次：
    //     powershell -ExecutionPolicy Bypass -File tools\fetch_dev_mods.ps1
    // 它会把 refinedstorage-curios-integration-1.0.0.jar 放进 run\mods（runClient / runServer
    // 会自动加载 mods 目录）。为什么必须装：本模组的 Curios 饰品槽背景直接引用它的精灵
    // refinedstorage_curios_integration:slot/curios（见 src/main/templates/META-INF/neoforge.mods.toml
    // 里的 required 依赖），缺它时槽位背景会渲染成缺失贴图、且加载器会拒绝加载本模组。

    // RS 的 API 类标注使用 apiguardian 注解，编译期需要该库
    compileOnly("org.apiguardian:apiguardian-api:1.1.2")

    // ===== Jade（指向信息模组，**可选依赖**）=====
    // 用途：装了 Jade 时，被伪装的方块在瞄准提示里显示
    //   图标 = 填充方块 / 文本 = 原部件类型 +「（被伪装）」/ 详细信息 ID 仍按原部件；
    //   唯一数据来源是 support/RsccCamouflageDisplay（不另起第二份口径），
    //   接入点是 client/jade/RsccJadePlugin（@WailaPlugin + IBlockComponentProvider）。
    // 为什么是可选：本模组只实现它的公开 API 并注册插件；未安装 Jade 时没有任何调用方
    //   （插件类不会被 Jade 扫描，也没有别处引用它），本模组照常加载、照常工作；
    //   src/main/templates/META-INF/neoforge.mods.toml 里也把它声明为 type = "optional"（side = CLIENT）。
    //
    // 为什么用**工程内本地文件**而不是 Maven 坐标（不要改回 maven.modrinth:jade:...）：
    //   2026-09-30 用户机器上 :classes 失败，根因是到 Modrinth CDN 的 TLS 证书链校验不通过
    //   （certificate_unknown / PKIX path building failed，代理或安全软件拦截，属环境问题）：
    //     Could not GET 'https://cdn-alt.modrinth.com/data/nvQzSEkH/versions/.../Jade-1.21.1-NeoForge-15.10.5.jar'
    //   因此这里改成随工程走的本地制品，构建**完全不需要联网**解析 Jade。
    //   制品来源与校验（可重复核对）：Modrinth 项目 jade（project id nvQzSEkH）版本 15.10.5+neoforge
    //     文件 Jade-1.21.1-NeoForge-15.10.5.jar，sha1 = d5bf134b3dbde9f5258666823900e21341dc0a50，
    //     已在 libs/ 下原样保存为 libs/jade-15.10.5+neoforge.jar（大小 725742 字节）。
    //   更新方式：换版本时把这个文件替换掉并同步改上面的注释（gradle.properties 里不再有 jade_version）。
    //   注意：.gitignore 里有 `*.jar` 规则，因此已在文件末尾加了 `!libs/*.jar` 例外，
    //   否则该制品会被静默忽略、别人 clone 后 :classes 会因缺 Jade 类而失败。
    //   —— 这套做法已是本工程规矩：新增「可选依赖 / 外部模组制品」一律走 libs/ 本地文件，
    //   完整步骤与登记要求见 docs/dependency-policy.md（本段就是该规矩的先例与范例）。
    compileOnly(files("libs/jade-15.10.5+neoforge.jar"))
    // 开发环境（runClient / runServer）也让它真的在场；同样是本地文件，不引入任何联网解析。
    runtimeOnly(files("libs/jade-15.10.5+neoforge.jar"))

    // FTB Ultimine（连锁采矿，**联动模组** / 可选前置）：本模组只用它来让两种框架（分隔 / 伪装）
    // 支持「按住连锁键 → 成片套壳」。普通右键永远只套命中那一格，与本依赖无关。
    // 代码全程走反射（见 support/RsccUltimineIntegration，与 Curios 那条同一套做法），
    // 因此下面两行**故意保持注释**：不装它 / 解析不到它都不影响 javac 编译，也不影响游戏加载与既有玩法。
    // 开发环境若要实测连锁套壳（需同时装好它自己的前置 Architectury API 与 FTB Library），把这两行取消注释，
    // 或直接把它（以及 Architectury API、FTB Library）的 jar 放进 run\mods：
    //     compileOnly("dev.ftb.mods:ftb-ultimine:2101.1.15")
    //     runtimeOnly("dev.ftb.mods:ftb-ultimine-neoforge:2101.1.15")
    // 说明：mods.toml 里已声明它 type = "optional"，因此上述 jar 缺席时本模组照常加载。
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    filteringCharset = 'UTF-8' // 模板与占位符统一按 UTF-8 处理，避免中文乱码
    var replaceProperties = [minecraft_version      : minecraft_version,
                             minecraft_version_range: minecraft_version_range,
                             neo_version            : neo_version,
                             neo_version_range      : neo_version_range,
                             loader_version_range   : loader_version_range,
                             mod_id                 : mod_id,
                             mod_name               : mod_name,
                             mod_license            : mod_license,
                             mod_version            : mod_version,
                             mod_authors            : mod_authors,
                             mod_description        : mod_description]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
